plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

import org.apache.tools.ant.filters.ReplaceTokens

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = "https://maven.nucleoid.xyz/" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation include("eu.pb4:sgui:${project.sgui_version}")
	api "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version}"
	api "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation include("org.apache.groovy:groovy:${project.groovy_version}")
	testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
	testImplementation "org.mockito:mockito-core:5.23.0"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xlint:deprecation"]
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	workingDir = layout.buildDirectory.dir('test-work').get().asFile
	doFirst {
		workingDir.mkdirs()
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "LICENSE_${inputs.properties.archivesName}" }
	}
}

def scriptSdkStage = layout.buildDirectory.dir('script-sdk/stage')
def scriptSdkRepository = layout.buildDirectory.dir('script-sdk/repository')

tasks.register('prepareScriptSdk', Sync) {
	dependsOn 'publishMavenJavaPublicationToScriptSdkRepository'
	into scriptSdkStage

	from('sdk/template') {
		filter(ReplaceTokens, tokens: [
			MINECRAFT_VERSION: project.minecraft_version,
			LOADER_VERSION: project.loader_version,
			LOOM_VERSION: project.loom_version,
			FABRIC_VERSION: project.fabric_version,
			GROOVY_VERSION: project.groovy_version,
			STARRYLIST_VERSION: project.mod_version
		])
	}
	from('gradlew') {
		filePermissions {
			unix('rwxr-xr-x')
		}
	}
	from('gradlew.bat')
	from('gradle/wrapper') {
		into 'gradle/wrapper'
	}
	from(scriptSdkRepository) {
		into 'repository'
	}
}

tasks.register('scriptSdkZip', Zip) {
	dependsOn tasks.named('prepareScriptSdk')
	from scriptSdkStage
	eachFile { details ->
		if (details.path == 'gradlew') {
			details.permissions {
				unix('rwxr-xr-x')
			}
		}
	}
	destinationDirectory = layout.buildDirectory.dir('libs')
	archiveFileName = "${project.archives_base_name}-${project.version}-script-sdk.zip"
	reproducibleFileOrder = true
	preserveFileTimestamps = false
}

tasks.named('build') {
	dependsOn tasks.named('scriptSdkZip')
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
		maven {
			name = 'scriptSdk'
			url = scriptSdkRepository
		}
	}
}
